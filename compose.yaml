include:
  - path: spring.yaml

name: lelviv
services:
  backend:
    image: "${BACK_IMAGE:-ghcr.io/lelviv/backend:${BACK_TAG:-develop}}"
    environment:
      SERVER_HOST: 0.0.0.0
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-lelviv}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-lelviv}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-lelviv}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-ChangeThisJwtSecretKeyToAStrongRandomValue01}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
    ports:
      - "${SERVER_HOST:-127.0.0.1}:${SERVER_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - db
    restart: unless-stopped
    stop_grace_period: 35s
