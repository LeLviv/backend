name: Build

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: "Version of image to publish"
        required: false
        type: string

env:
  REGISTRY: ghcr.io

jobs:
  build_container_job:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    outputs:
      full_image_ref: ${{ steps.set_image_ref.outputs.image_ref }}

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v6

      - name: Add firebase secret key to project
        run: |
          mkdir -p src/main/resources
          echo "${{ secrets.FIREBASE_SECRET }}" >> src/main/resources/firebase-service-account.json

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6
        with:
          build-scan-publish: false
          cache-provider: basic
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/develop' }}

      - name: Log in to container registry
        uses: docker/login-action@65b78e6e13532edd9afa3aa52ac7964289d1a9c1
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image name
        id: set_image_ref
        run: |
          NAME="${GITHUB_REPOSITORY,,}"
          if [ "$GITHUB_REF" = "refs/heads/main" ] ; then NAME="$NAME/prod"; fi
          echo "IMAGE_NAME=$NAME" >> "$GITHUB_ENV"
          echo "image_ref=${{ env.REGISTRY }}/$NAME" >> "$GITHUB_OUTPUT"

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@9ec57ed1fcdbf14dcef7dfbe97b2010124a938b7
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=,format=short
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=raw,value=${{ inputs.version }},enable=${{ inputs.version != '' }}

      - name: Build container
        run: |
          FORMATTED_LABELS=$(echo "${{ steps.meta.outputs.labels }}" | tr '\n' ' ')
          ./gradlew bootBuildImage --imageName=backend:latest --environment="BP_IMAGE_LABELS=$FORMATTED_LABELS"

      - name: Add tags to image and push
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            if [ -n "$tag" ]; then
              docker tag backend:latest "${tag}"
            fi
          done <<< "$TAGS"
          docker push --all-tags "${{env.REGISTRY}}/${{env.IMAGE_NAME}}"
  scan:
    needs: build_container_job
    uses: ./.github/workflows/trivy-scan.yaml
    with:
      image-ref: "${{ needs.build_container_job.outputs.full_image_ref }}"
