server:
  forward-headers-strategy: framework
  shutdown: graceful

spring:
  flyway:
    clean-disabled: true
    validate-on-migrate: true
    fail-on-missing-locations: true
  lifecycle:
    timeout-per-shutdown-phase: 30s
  datasource:
    hikari:
      pool-name: LeLvivProdHikariPool
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: ${DB_POOL_MIN:5}
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1200000
      leak-detection-threshold: 30000
  jpa:
    properties:
      hibernate:
        jdbc:
          batch_size: 25
          batch_versioned_data: true
        order_inserts: true
        order_updates: true

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

management:
  server:
    port: ${MANAGEMENT_PORT:8081}
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  structured:
    format:
      console: ecs
  level:
    root: INFO
    ua.garage: INFO
    web: WARN
    org.hibernate: WARN
